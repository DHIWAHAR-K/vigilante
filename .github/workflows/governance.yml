name: Governance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository policy
        run: ./scripts/validate-governance.sh

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          COMMIT_SUBJECT: ${{ github.event.pull_request.title }}
        run: ./scripts/validate-commit-message.sh "$COMMIT_SUBJECT"

      - name: Validate main commit subject
        if: github.event_name == 'push'
        run: ./scripts/validate-commit-message.sh "$(git log -1 --format=%s)"
